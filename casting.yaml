apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  telemetrykeeper:
    spec:
      image: clickhouse/clickhouse-keeper:25.5.6
  telemetrystore:
    spec:
      image: clickhouse/clickhouse-server:25.5.6
  mcp:
    spec:
      enabled: true
  signoz:
    spec:
      image: signoz/signoz:v0.128.0

